apiVersion: v1
kind: ConfigMap
metadata:
  name: model-deployment-otel-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
    processors:
      batch:
    exporters:
      logging:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [logging]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [logging]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-deployment-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-deployment-otel-collector
  template:
    metadata:
      labels:
        app: model-deployment-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:latest
          args:
            - --config=/etc/otel/collector.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: model-deployment-otel-collector
