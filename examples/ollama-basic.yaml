apiVersion: ai.platform.dev/v1alpha1
kind: ModelDeployment
metadata:
  name: ollama-basic
spec:
  provider: ollama
  modelName: llama3
  image: ollama/ollama:latest
  replicas: 1
  resources:
    cpu: "1"
    memory: "2Gi"
    gpu: 0
  service:
    type: ClusterIP
    port: 11434
  observability:
    enabled: true
    prometheus: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-basic-allow-model-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ollama-basic
      app.kubernetes.io/component: inference
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 11434
