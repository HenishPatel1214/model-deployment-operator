apiVersion: ai.platform.dev/v1alpha1
kind: ModelDeployment
metadata:
  name: ollama-autoscaling
spec:
  provider: ollama
  modelName: llama3
  image: ollama/ollama:latest
  replicas: 1
  resources:
    cpu: "2"
    memory: "4Gi"
  service:
    type: ClusterIP
    port: 11434
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  observability:
    enabled: true
    prometheus: true
