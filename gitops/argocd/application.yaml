apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-deployment-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HenishPatel1214/model-deployment-operator.git
    targetRevision: main
    path: charts/model-deployment-operator
    helm:
      values: |
        metrics:
          serviceMonitor:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: model-deployment-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
